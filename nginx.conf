# nginx.conf
# Serves the React single-page application.
# All routes fall back to index.html — React Router handles routing.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Serve static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # All other routes fall back to index.html
    # This is required for React Router to work correctly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression for faster delivery
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;
}